<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Sistema de Consulta de Notas</h1>
            <p>Informe o nome do estudante e suas três notas para calcular a média acadêmica.</p>
        </header>

        <section class="card">
            <form id="form-notas" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="nome">Nome do Estudante:</label>
                    <input type="text" id="nome" placeholder="Ex: Ana Silva" required>
                </div>

                <div class="notas-container">
                    <div class="input-group">
                        <label for="nota1">Nota 1:</label>
                        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0.0 a 10.0">
                    </div>
                    <div class="input-group">
                        <label for="nota2">Nota 2:</label>
                        <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0.0 a 10.0">
                    </div>
                    <div class="input-group">
                        <label for="nota3">Nota 3:</label>
                        <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="0.0 a 10.0">
                    </div>
                </div>

                <div class="botoes-container">
                    <button type="button" id="btn-calcular" onclick="calcularMedia()">Calcular Média</button>
                    <button type="button" id="btn-limpar" class="btn-secundario" onclick="limparCampos()">Limpar</button>
                </div>
            </form>

            <!-- Área de Resultado e Mensagens -->
            <div id="mensagem-erro" class="mensagem-erro hidden"></div>
            <div id="resultado" class="resultado-box hidden">
                <h2 id="res-nome"></h2>
                <div class="media-destaque">
                    <span>Média Final:</span>
                    <strong id="res-media"></strong>
                </div>
                <p class="situacao-texto">Situação: <span id="res-situacao"></span></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
